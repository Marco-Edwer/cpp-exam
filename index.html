<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Full Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2b6cb0;
    --primary-dark:#1a4971;
    --accent:#0ea5a4;
    --bg:#eef2f9;
    --card:#ffffff;
    --correct:#2f9e44;
    --wrong:#e03131;
    --border:#dbe3ee;
    --text:#1f2937;
    --muted:#64748b;
    --pdf:#e8590c;
    --pdf-dark:#c94a08;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:auto;}
  body{
    margin:0;
    font-family:'Tajawal','Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px;
  }
  .container{
    max-width:800px;
    margin:0 auto;
  }
  .header{
    background:linear-gradient(135deg,var(--primary),var(--accent));
    color:#fff;
    padding:24px 28px;
    border-radius:16px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    box-shadow:0 6px 18px rgba(43,108,176,0.25);
  }
  .header h1{margin:0;font-size:1.4rem;font-weight:700;}
  .header p{margin:6px 0 0;font-size:0.88rem;opacity:0.95;}
  #timer{
    background:rgba(255,255,255,0.2);
    padding:10px 20px;
    border-radius:12px;
    font-size:1.4rem;
    font-weight:900;
    min-width:110px;
    text-align:center;
    letter-spacing:1px;
  }
  #timer.warn{background:#e03131;}
  .progress-wrap{
    background:#d7e0ee;
    border-radius:8px;
    height:10px;
    margin-bottom:20px;
    overflow:hidden;
  }
  #progress-bar{
    height:100%;
    background:linear-gradient(90deg,var(--primary),var(--accent));
    width:0%;
    transition:width 0.3s;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 3px 12px rgba(30,41,59,0.07);
    border:1px solid var(--border);
  }
  .q-number{
    display:inline-block;
    background:var(--primary);
    color:#fff;
    width:32px;
    height:32px;
    border-radius:50%;
    text-align:center;
    line-height:32px;
    font-size:0.9rem;
    font-weight:700;
    margin-left:10px;
  }
  .q-text{
    font-size:1.06rem;
    font-weight:700;
    margin:10px 0 16px;
    line-height:1.7;
}
  .q-code{
    background:#0f172a;
    color:#e2e8f0;
    padding:14px 16px;
    border-radius:10px;
    font-family:'Consolas','Courier New',monospace;
    direction:ltr;
    text-align:left;
    margin:10px 0 16px;
    white-space:pre;
    overflow-x:auto;
    font-size:0.9rem;
    line-height:1.5;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 15px;
    border:2px solid var(--border);
    border-radius:12px;
    cursor:pointer;
    transition:all 0.15s;
    font-size:0.98rem;
  }
  .option:hover{border-color:var(--primary);background:#f0f6ff;}
  .option.selected{
    border-color:var(--primary);
    background:#e7f1ff;
    font-weight:700;
  }
  .option input{accent-color:var(--primary);}
  .footer-bar{
    position:sticky;
    bottom:0;
    background:var(--bg);
    padding:14px 0;
    text-align:center;
  }
  button{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:14px 40px;
    font-size:1.05rem;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    transition:all 0.15s;
    font-family:inherit;
  }
  button:hover{background:var(--primary-dark);transform:translateY(-1px);}
  button:disabled{background:#94a3b8;cursor:not-allowed;}
  #results{
    display:none;
  }
  .score-card{
    text-align:center;
    background:var(--card);
    border-radius:16px;
    padding:32px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(30,41,59,0.07);
  }
  .score-num{
    font-size:3.2rem;
    font-weight:900;
    color:var(--primary);
  }
  .score-msg{
    font-size:1.1rem;
    color:var(--muted);
    margin-top:8px;
    font-weight:500;
  }
  .review-item{
    border-right:5px solid var(--correct);
  }
  .review-item.wrong{
    border-right:5px solid var(--wrong);
  }
  .answer-line{
    padding:11px 14px;
    border-radius:10px;
    margin-top:6px;
    font-size:0.95rem;
  }
  .answer-line.correct{background:#ebfbee;color:var(--correct);font-weight:700;}
  .answer-line.wrong{background:#fff5f5;color:var(--wrong);font-weight:700;}
  #not-answered-warning{
    color:var(--wrong);
    text-align:center;
    margin-bottom:10px;
    font-size:0.9rem;
    display:none;
    font-weight:700;
  }
  .unanswered{border-color:#f59f00 !important;}

  /* Start screen */
  #start-screen{
    background:var(--card);
    border-radius:16px;
    padding:36px 30px;
    text-align:center;
    box-shadow:0 3px 14px rgba(30,41,59,0.08);
  }
  #start-screen h2{margin-top:0;font-size:1.3rem;}
  #start-screen p{color:var(--muted);}
  #start-screen input{
    width:100%;
    max-width:320px;
    padding:15px 16px;
    font-size:1.05rem;
    border:2px solid var(--border);
    border-radius:12px;
    margin:16px 0;
    text-align:center;
    font-family:inherit;
  }
  #start-screen input:focus{outline:none;border-color:var(--primary);}
  #name-warning{
    color:var(--wrong);
    font-size:0.9rem;
    display:none;
    margin-bottom:10px;
    font-weight:700;
  }
  .action-buttons{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:18px;
  }
  .pdf-btn{ background:var(--pdf); }
  .pdf-btn:hover{ background:var(--pdf-dark); }
  #send-instructions{
    margin-top:16px;
    text-align:right;
    background:#fff8e1;
    border:1px solid #f5c518;
    border-radius:12px;
    padding:16px 18px;
    font-size:0.9rem;
    color:#5a4a00;
    line-height:1.8;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div id="timer">30:00</div>
    <div>
      <h1 style="direction:ltr; unicode-bidi:isolate;">C++ Full Exam</h1>
      <p style="margin-top:2px; font-weight:500;">إعداد: Eng.Marco Edwer</p>
    </div>
  </div>

  <div id="start-screen">
    <h2>بيانات الطالب</h2>
    <p>يرجى كتابة الاسم قبل بدء الامتحان</p>
    <div id="name-warning">يرجى كتابة الاسم أولاً</div>
    <input type="text" id="student-name" placeholder="الاسم">
    <br>
    <button id="start-btn">ابدأ الامتحان</button>
  </div>

  <div class="progress-wrap" style="display:none;"><div id="progress-bar"></div></div>

  <div id="quiz-area"></div>

  <div id="not-answered-warning">يرجى الإجابة عن جميع الأسئلة قبل التسليم</div>

  <div class="footer-bar" style="display:none;">
    <button id="submit-btn">تسليم الامتحان</button>
  </div>

  <div id="results">
    <div id="report-content">
      <div id="print-meta" class="score-card" style="padding:24px;">
        <div id="score-emoji" style="font-size:3rem; line-height:1; margin-bottom:6px;"></div>
        <div class="score-num" id="score-num">0 / 40</div>
        <div class="score-msg" id="score-msg"></div>
        <div class="action-buttons">
          <a class="pdf-btn" id="send-wa-btn" href="#" target="_blank" style="background:#25D366; text-decoration:none;">📱 إرسال التقرير على واتساب</a>
        </div>
      </div>
      <div id="review-area"></div>
    </div>
  </div>

</div>

<script>
window.scrollTo(0,0);

const TEACHER_PHONE = "201275166855"; // رقم واتساب المستر

const questions = [
  // ===== Control Statements (6) =====
  {
    q: "What is the output of the following code? (Note the use of short-circuit evaluation)",
    code: "int a = 0;\nif(a != 0 && (10 / a) > 1)\n    cout << \"X\";\nelse\n    cout << \"Y\";",
    options: ["X", "Y", "Runtime Error (division by zero)", "Compilation Error"],
    correct: 1
  },
  {
    q: "What is the output of the following switch statement with fall-through cases?",
    code: "int x = 4;\nswitch(x)\n{\n    case 1:\n    case 2:\n    case 3:\n        cout << \"Low\";\n        break;\n    case 4:\n    case 5:\n        cout << \"Mid\";\n        break;\n    default:\n        cout << \"High\";\n}",
    options: ["Low", "Mid", "High", "LowMid"],
    correct: 1
  },
  {
    q: "What is the output of the following code using nested ternary operators?",
    code: "int x = 15;\nstring result = (x < 10) ? \"A\" : (x < 20) ? \"B\" : \"C\";\ncout << result;",
    options: ["A", "B", "C", "Compilation Error"],
    correct: 1
  },
  {
    q: "What is the output of the following code? (Watch the operator used inside the if condition)",
    code: "int x = 5;\nif(x = 0)\n    cout << \"True\";\nelse\n    cout << \"False\";",
    options: ["True", "False", "Compilation Error", "Runtime Error"],
    correct: 1
  },
  {
    q: "What is the output of the following code? (This is a classic C++ pitfall)",
    code: "int a = 3, b = 4, c = 5;\nif(a < b < c)\n    cout << \"T\";\nelse\n    cout << \"F\";",
    options: ["T (because (a<b) evaluates to 1, and 1<c is true)", "F", "Compilation Error", "Undefined Behavior"],
    correct: 0
  },
  {
    q: "What is the output of the following nested if-else code, where a variable is modified inside the block?",
    code: "int x = 10, y = 20;\nif(x > 5)\n{\n    x += 5;\n    if(y > x)\n        cout << \"A\";\n    else\n        cout << \"B\";\n}\nelse if(x > 0)\n{\n    cout << \"C\";\n}\nelse\n{\n    cout << \"D\";\n}",
    options: ["A", "B", "C", "D"],
    correct: 0
  },
  // ===== Loops (10) =====
  {
    q: "What is the output of the following code with a nested loop and a conditional break in the inner loop?",
    code: "for(int i = 0; i < 3; i++)\n{\n    for(int j = 0; j < 3; j++)\n    {\n        if(i == j)\n            break;\n        cout << i << j;\n    }\n}",
    options: ["102021", "001122", "010212", "012021"],
    correct: 0
  },
  {
    q: "What is the output of the following code? (Pay attention to the post-increment operator inside the condition)",
    code: "int i = 0;\nwhile(i++ < 3)\n{\n    cout << i;\n}",
    options: ["123", "012", "1234", "023"],
    correct: 0
  },
  {
    q: "What is the output of the following for-loop that uses the comma operator with two counters?",
    code: "for(int i = 0, j = 5; i < j; i++, j--)\n{\n    cout << i << j;\n}",
    options: ["051423", "0512233445", "0123", "54321"],
    correct: 0
  },
  {
    q: "What is the output of the following do-while loop?",
    code: "int i = 10;\ndo\n{\n    cout << i;\n    i -= 3;\n} while(i > 0);",
    options: ["10741", "1074", "10", "10741-2"],
    correct: 0
  },
  {
    q: "What is the output of the following code with a nested loop using continue in the inner loop?",
    code: "for(int i = 1; i <= 2; i++)\n{\n    for(int j = 1; j <= 3; j++)\n    {\n        if(j == 2)\n            continue;\n        cout << i << j;\n    }\n}",
    options: ["11132123", "111213212223", "1123", "112213"],
    correct: 0
  },
  {
    q: "What happens when the following code is executed?",
    code: "for(unsigned int i = 5; i >= 0; i--)\n{\n    cout << i;\n}",
    options: [
      "It prints 543210 and stops",
      "This is an infinite loop, because an unsigned integer can never be negative, so i >= 0 is always true",
      "Compilation Error",
      "It prints 5432100"
    ],
    correct: 1
  },
  {
    q: "What is the output of the following code that computes a product using a while loop?",
    code: "int i = 1, product = 1;\nwhile(i <= 4)\n{\n    product *= i;\n    i++;\n}\ncout << product;",
    options: ["24", "10", "4", "1"],
    correct: 0
  },
  {
    q: "What is the output of the following code? (Note that break inside a switch only exits the switch, not the enclosing loop)",
    code: "for(int i = 0; i < 3; i++)\n{\n    switch(i)\n    {\n        case 1:\n            break;\n        default:\n            cout << i;\n    }\n}",
    options: ["02", "012", "0", "Infinite Loop"],
    correct: 0
  },
  {
    q: "What is the time complexity of the following nested loop, where the inner loop's bound depends on the outer loop's counter?",
    code: "for(int i = 0; i < n; i++)\n{\n    for(int j = 0; j < i; j++)\n    {\n        cout << i << j;\n    }\n}",
    options: ["O(n)", "O(n log n)", "O(n^2)", "O(2^n)"],
    correct: 2
  },
  {
    q: "What is the output of the following code, given that a do-while loop always executes its body at least once?",
    code: "int i = 100;\ndo\n{\n    cout << \"Run\";\n} while(i < 10);",
    options: ["Run", "Nothing is printed", "Infinite Loop", "Compilation Error"],
    correct: 0
  },
  // ===== Arrays (8) =====
  {
    q: "What is the output of the following code that uses pointer arithmetic on an array?",
    code: "int arr[5] = {10, 20, 30, 40, 50};\ncout << *(arr + 2);",
    options: ["10", "20", "30", "Compilation Error"],
    correct: 2
  },
  {
    q: "What is the output of the following code, which is a common technique to compute the number of elements in an array?",
    code: "int arr[10];\ncout << sizeof(arr) / sizeof(arr[0]);",
    options: ["10", "40", "4", "Compilation Error"],
    correct: 0
  },
  {
    q: "What is the output of the following code that traverses a 2D array conditionally?",
    code: "int arr[2][3] = {{1,2,3},{4,5,6}};\nfor(int i = 0; i < 2; i++)\n    for(int j = 0; j < 3; j++)\n        if((i + j) % 2 == 0)\n            cout << arr[i][j];",
    options: ["135", "246", "123456", "15"],
    correct: 0
  },
  {
    q: "What does the following code print? (This demonstrates array-to-pointer decay when passed to a function)",
    code: "void printSize(int arr[])\n{\n    cout << sizeof(arr);\n}\n\nint main()\n{\n    int nums[10];\n    printSize(nums);\n}",
    options: [
      "40 (10 elements * 4 bytes)",
      "10 (the number of elements)",
      "The size of a pointer (e.g. 8 bytes on a 64-bit system), NOT the array's size",
      "Compilation Error"
    ],
    correct: 2
  },
  {
    q: "What is the output of the following code, where the array is only partially initialized?",
    code: "int arr[5] = {1, 2};\ncout << arr[4];",
    options: [
      "0 (remaining elements are automatically zero-initialized)",
      "Garbage value (Undefined Behavior)",
      "2",
      "Compilation Error"
    ],
    correct: 0
  },
  {
    q: "What is the output of the following code that passes a 2D array to a function and modifies it?",
    code: "void modify(int arr[][3], int rows)\n{\n    for(int i = 0; i < rows; i++)\n        arr[i][0] = 0;\n}\n\nint main()\n{\n    int a[2][3] = {{1,2,3},{4,5,6}};\n    modify(a, 2);\n    cout << a[1][0];\n}",
    options: ["4", "0", "1", "Compilation Error"],
    correct: 1
  },
  {
    q: "Given `int arr[5] = {1,2,3,4,5};`, what happens when you access `arr[-1]`?",
    options: [
      "It safely returns 0",
      "It always returns the last element (5)",
      "Undefined Behavior — C++ performs no bounds checking, so this accesses memory before the array",
      "Compilation Error, because arrays disallow negative indices"
    ],
    correct: 2
  },
  {
    q: "What is the value of arr[1] after the following in-place array reversal code executes?",
    code: "int arr[5] = {1,2,3,4,5};\nint start = 0, end = 4;\nwhile(start < end)\n{\n    int temp = arr[start];\n    arr[start] = arr[end];\n    arr[end] = temp;\n    start++;\n    end--;\n}\ncout << arr[1];",
    options: ["2", "4", "5", "1"],
    correct: 1
  },
  // ===== Vectors (6) =====
  {
    q: "What is the most likely outcome of running the following code?",
    code: "vector<int> v = {1, 2, 3, 4, 5};\nfor(auto it = v.begin(); it != v.end(); it++)\n{\n    if(*it == 3)\n        v.erase(it);\n}\ncout << v.size();",
    options: [
      "4",
      "5",
      "Undefined Behavior — erase() invalidates the iterator, and incrementing it afterward is unsafe",
      "Compilation Error"
    ],
    correct: 2
  },
  {
    q: "What is the output of the following code that shows the difference between size() and capacity()?",
    code: "vector<int> v;\nv.reserve(10);\ncout << v.size() << \" \" << v.capacity();",
    options: ["0 10", "10 10", "10 0", "0 0"],
    correct: 0
  },
  {
    q: "What is the output of the following code that passes a vector by reference to a function?",
    code: "void addElement(vector<int> &v)\n{\n    v.push_back(100);\n}\n\nint main()\n{\n    vector<int> nums = {1,2,3};\n    addElement(nums);\n    cout << nums.size();\n}",
    options: ["3", "4", "Compilation Error", "0"],
    correct: 1
  },
  {
    q: "What is the output of the following code that uses a vector of vectors (jagged rows)?",
    code: "vector<vector<int>> matrix = {{1,2},{3,4,5}};\ncout << matrix[1].size();",
    options: ["2", "3", "5", "Compilation Error"],
    correct: 1
  },
  {
    q: "What is the key difference in behavior between accessing an out-of-range index using v[i] versus v.at(i) for a vector v?",
    options: [
      "v[i] throws std::out_of_range while v.at(i) causes Undefined Behavior",
      "v.at(i) performs bounds checking and throws std::out_of_range on an invalid index, while v[i] does NOT check bounds and causes Undefined Behavior",
      "Both behave identically and throw the same exception",
      "v[i] always causes a Compilation Error for invalid indices"
    ],
    correct: 1
  },
  {
    q: "What is the output of the following code that combines erase() and insert() on a vector?",
    code: "vector<int> v = {10, 20, 30, 40};\nv.erase(v.begin() + 1);\nv.insert(v.begin(), 5);\ncout << v[2];",
    options: ["10", "20", "30", "40"],
    correct: 2
  },
  // ===== Functions (6) =====
  {
    q: "What is the output of the following code that uses function overloading?",
    code: "void show(int x) { cout << \"int\"; }\nvoid show(double x) { cout << \"double\"; }\n\nint main()\n{\n    show(5);\n    show(5.5);\n    show('A');\n}",
    options: ["intdoubleint", "intdoubledouble", "doubledoubleint", "Compilation Error - ambiguous call"],
    correct: 0
  },
  {
    q: "What is the output of the following code that uses default arguments?",
    code: "int calc(int a, int b = 10, int c = 20)\n{\n    return a + b + c;\n}\n\nint main()\n{\n    cout << calc(5, 5);\n}",
    options: ["15", "30", "35", "Compilation Error"],
    correct: 1
  },
  {
    q: "What is the output of the following code that uses a static local variable?",
    code: "void counter()\n{\n    static int count = 0;\n    count++;\n    cout << count;\n}\n\nint main()\n{\n    counter();\n    counter();\n    counter();\n}",
    options: ["111", "123", "000", "Compilation Error"],
    correct: 1
  },
  {
    q: "What is the most likely outcome of running the following code?",
    code: "int& getValue()\n{\n    int x = 42;\n    return x;\n}\n\nint main()\n{\n    int& ref = getValue();\n    cout << ref;\n}",
    options: [
      "42",
      "0",
      "Undefined Behavior — the function returns a reference to a local variable that no longer exists after the function returns",
      "Compilation Error, this code cannot compile"
    ],
    correct: 2
  },
  {
    q: "What is the output of the following code, which attempts to swap two variables?",
    code: "void swap(int a, int b)\n{\n    int temp = a;\n    a = b;\n    b = temp;\n}\n\nint main()\n{\n    int x = 5, y = 10;\n    swap(x, y);\n    cout << x << \" \" << y;\n}",
    options: [
      "5 10 (pass by value does not affect the original variables)",
      "10 5",
      "0 0",
      "Compilation Error"
    ],
    correct: 0
  },
  {
    q: "What happens when the following code is compiled?",
    code: "void process(int a, int b = 0) { cout << \"A\"; }\nvoid process(int a) { cout << \"B\"; }\n\nint main()\n{\n    process(5);\n}",
    options: ["A", "B", "AB", "Compilation Error — the call process(5) is ambiguous"],
    correct: 3
  },
  // ===== Recursion (4) =====
  {
    q: "What is the output of the following recursive Fibonacci code?",
    code: "int fib(int n)\n{\n    if(n <= 1)\n        return n;\n    return fib(n - 1) + fib(n - 2);\n}\n\nint main()\n{\n    cout << fib(5);\n}",
    options: ["3", "5", "8", "13"],
    correct: 1
  },
  {
    q: "What is the time complexity of the naive recursive Fibonacci function fib(n) = fib(n-1) + fib(n-2), without memoization?",
    options: ["O(n)", "O(n log n)", "O(n^2)", "O(2^n)"],
    correct: 3
  },
  {
    q: "What is the output of the following recursive code that prints both before and after the recursive call?",
    code: "void printNums(int n)\n{\n    if(n == 0)\n        return;\n    cout << n;\n    printNums(n - 1);\n    cout << n;\n}\n\nint main()\n{\n    printNums(3);\n}",
    options: ["321123", "123321", "321321", "123123"],
    correct: 0
  },
  {
    q: "Two functions A() and B() call each other (A calls B, and B calls A) with no base case to stop the recursion. What is this called, and what is the likely outcome?",
    options: [
      "Tail Recursion — the compiler optimizes it automatically and it runs efficiently",
      "Indirect (Mutual) Recursion — without a base case, this leads to infinite recursive calls and most likely a Stack Overflow",
      "This is invalid syntax and the code will not compile",
      "Direct Recursion — it automatically terminates after one cycle"
    ],
    correct: 1
  }
];

const TOTAL_TIME = 30 * 60; // 30 minutes in seconds
let timeLeft = TOTAL_TIME;
let timerInterval;
let examStartTimestamp = null; // وقت البداية الحقيقي (wall-clock) لضمان استمرار العد حتى لو تم إخفاء المتصفح
let userAnswers = new Array(questions.length).fill(null);
let submitted = false;
let studentName = "";

function renderQuiz(){
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';
  questions.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + idx;

    let codeHtml = '';
    if(item.code){
      codeHtml = `<div class="q-code">${item.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
    }

    let optionsHtml = '';
    item.options.forEach((opt, oIdx) => {
      optionsHtml += `
        <label class="option" data-q="${idx}" data-o="${oIdx}">
          <input type="radio" name="q${idx}" value="${oIdx}">
          <span>${opt}</span>
        </label>`;
    });

    card.innerHTML = `
      <div><span class="q-number">${idx+1}</span></div>
      <div class="q-text">${item.q}</div>
      ${codeHtml}
      <div class="options">${optionsHtml}</div>
    `;
    area.appendChild(card);
  });

  document.querySelectorAll('.option').forEach(opt => {
    opt.addEventListener('click', function(){
      const qIdx = parseInt(this.dataset.q);
      const oIdx = parseInt(this.dataset.o);
      userAnswers[qIdx] = oIdx;
      const card = document.getElementById('card-'+qIdx);
      card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      this.classList.add('selected');
      card.classList.remove('unanswered');
      this.querySelector('input').checked = true;
      updateProgress();
    });
  });
}

function updateProgress(){
  const answered = userAnswers.filter(a => a !== null).length;
  const pct = (answered / questions.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){}
  }
}
function playTick(freq, duration){
  if(!audioCtx) return;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }catch(e){}
}

function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m + ':' + s;
}

function startTimer(){
  const timerEl = document.getElementById('timer');
  examStartTimestamp = Date.now();

  function tick(){
    if(submitted) return;
    // نحسب الوقت المتبقي دائمًا من الفارق الحقيقي بين الآن ولحظة البداية،
    // بدل الاعتماد فقط على عدّاد setInterval الذي يتباطأ أو يتوقف عندما
    // يقوم الطالب بإخفاء المتصفح أو الانتقال لتبويب آخر (مثل البحث عن الإجابة).
    // بهذه الطريقة يستمر العدّ التنازلي بدقة حتى لو رجع الطالب بعد دقائق.
    const elapsed = Math.floor((Date.now() - examStartTimestamp) / 1000);
    timeLeft = TOTAL_TIME - elapsed;
    if(timeLeft < 0) timeLeft = 0;

    timerEl.textContent = formatTime(timeLeft);
    if(timeLeft <= 60 && timeLeft > 0){
      timerEl.classList.add('warn');
      const freq = 500 + (60 - timeLeft) * 10;
      playTick(freq, timeLeft <= 10 ? 0.18 : 0.1);
    }
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      finishExam(true);
    }
  }

  tick();
  timerInterval = setInterval(tick, 1000);

  // عند رجوع الطالب للتبويب/المتصفح، نعيد الحساب فورًا لتصحيح أي فارق
  // ناتج عن إبطاء المتصفح للمؤقتات في الخلفية.
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && !submitted && examStartTimestamp !== null){
      tick();
    }
  });
}

let finalScore = 0;
let finalTotal = questions.length;
let finalPct = 0;
let wrongQuestionNumbers = [];

function finishExam(autoSubmit){
  if(submitted) return;

  if(!autoSubmit){
    const unanswered = userAnswers.some(a => a === null);
    if(unanswered){
      document.getElementById('not-answered-warning').style.display = 'block';
      let firstUnansweredIdx = null;
      userAnswers.forEach((a, idx) => {
        if(a === null){
          document.getElementById('card-'+idx).classList.add('unanswered');
          if(firstUnansweredIdx === null) firstUnansweredIdx = idx;
        }
      });
      if(firstUnansweredIdx !== null){
        const targetCard = document.getElementById('card-'+firstUnansweredIdx);
        targetCard.scrollIntoView({behavior:'smooth', block:'center'});
      }
      return;
    }
  }

  submitted = true;
  clearInterval(timerInterval);
  document.getElementById('not-answered-warning').style.display = 'none';

  let score = 0;
  wrongQuestionNumbers = [];
  const reviewArea = document.getElementById('review-area');
  reviewArea.innerHTML = '';

  questions.forEach((item, idx) => {
    const userA = userAnswers[idx];
    const isCorrect = userA === item.correct;
    if(isCorrect){ score++; } else { wrongQuestionNumbers.push(idx+1); }

    const div = document.createElement('div');
    div.className = 'card review-item' + (isCorrect ? '' : ' wrong');

    let codeHtml = '';
    if(item.code){
      codeHtml = `<div class="q-code">${item.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
    }

    let userAnswerText = userA === null ? 'لم تتم الإجابة' : item.options[userA];
    let answerHtml = '';
    if(isCorrect){
      answerHtml = `<div class="answer-line correct">الإجابة: ${userAnswerText} ✓ إجابة صحيحة</div>`;
    } else {
      answerHtml = `
        <div class="answer-line wrong">إجابة الطالب: ${userAnswerText} ✗</div>
        <div class="answer-line correct">الإجابة الصحيحة: ${item.options[item.correct]}</div>
      `;
    }

    div.innerHTML = `
      <div><span class="q-number">${idx+1}</span></div>
      <div class="q-text">${item.q}</div>
      ${codeHtml}
      ${answerHtml}
    `;
    reviewArea.appendChild(div);
  });

  finalScore = score;
  finalTotal = questions.length;
  finalPct = Math.round((score/finalTotal)*100);

  document.getElementById('score-num').textContent = finalScore + ' / ' + finalTotal;
  let msg = '';
  let bigEmoji = '';
  if(finalPct >= 90){ msg = 'ممتاز! أداء رائع'; bigEmoji = '🏆'; }
  else if(finalPct >= 75){ msg = 'جيد جدًا، استمر في المذاكرة'; bigEmoji = '😄'; }
  else if(finalPct >= 50){ msg = 'جيد، يحتاج إلى مزيد من المراجعة'; bigEmoji = '🙂'; }
  else { msg = 'يُنصح بمراجعة الدروس من البداية'; bigEmoji = '😕'; }

  document.getElementById('score-emoji').textContent = bigEmoji;

  const today = new Date();
  const dateStr = today.toLocaleDateString('ar-EG');
  document.getElementById('score-msg').innerHTML =
    `الاسم: <strong>${studentName}</strong><br>التاريخ: ${dateStr}<br>نسبة النجاح: ${finalPct}% — ${msg}`;

  document.getElementById('quiz-area').style.display = 'none';
  document.querySelector('.footer-bar').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  window.scrollTo({top:0, behavior:'auto'});
}

document.getElementById('send-wa-btn').addEventListener('click', function(e){
  e.preventDefault();

  const today = new Date();
  const dateStr = today.toLocaleDateString('ar-EG');
  const divider = '━━━━━━━━━━━━━━';

  let lines = [];
  lines.push('📊 *تقرير Quiz 2 in C++*');
  lines.push(divider);
  lines.push(`👤 *الاسم:* ${studentName}`);
  lines.push(`📅 *التاريخ:* ${dateStr}`);
  lines.push(`🎯 *الدرجة:* ${finalScore} / ${finalTotal}  (${finalPct}%)`);

  if(wrongQuestionNumbers.length){
    lines.push(`❌ *الأسئلة الخاطئة:* ${wrongQuestionNumbers.join('، ')}`);
  } else {
    lines.push('✅ *لا توجد أخطاء — إجابات كاملة وصحيحة*');
  }
  lines.push(divider);
  lines.push('📝 *تفاصيل الإجابات:*');

  questions.forEach((item, idx) => {
    const userA = userAnswers[idx];
    const isCorrect = userA === item.correct;
    const userAnswerText = userA === null ? 'لم تتم الإجابة' : item.options[userA];

    let block = `*السؤال ${idx+1}:* ${item.q}`;
    if(item.code){
      block += `\n\`\`\`${item.code}\`\`\``;
    }
    if(isCorrect){
      block += `\n✅ إجابة الطالب: ${userAnswerText}  (صحيحة)`;
    } else {
      block += `\n❌ إجابة الطالب: ${userAnswerText}`;
      block += `\n✔️ الإجابة الصحيحة: ${item.options[item.correct]}`;
    }
    lines.push(block);
    lines.push('▫️▫️▫️');
  });

  const fullReport = lines.join('\n\n');
  const waUrl = `https://wa.me/${TEACHER_PHONE}?text=${encodeURIComponent(fullReport)}`;
  window.open(waUrl, '_blank');
});

document.getElementById('start-btn').addEventListener('click', () => {
  const nameInput = document.getElementById('student-name');
  const name = nameInput.value.trim();
  if(name === ''){
    document.getElementById('name-warning').style.display = 'block';
    nameInput.focus();
    return;
  }
  studentName = name;
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'block';
  document.querySelector('.footer-bar').style.display = 'block';
  renderQuiz();
  startTimer();
  window.scrollTo({top:0, behavior:'auto'});
});

document.getElementById('submit-btn').addEventListener('click', () => finishExam(false));
</script>
