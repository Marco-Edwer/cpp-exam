<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امتحان C++ - حتى الحلقات التكرارية</title>
<style>
  :root{
    --primary:#2b6cb0;
    --primary-dark:#1a4971;
    --bg:#f4f7fb;
    --card:#ffffff;
    --correct:#2f9e44;
    --wrong:#e03131;
    --border:#dbe3ee;
    --text:#1f2937;
    --muted:#64748b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px;
  }
  .container{
    max-width:800px;
    margin:0 auto;
  }
  .header{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    padding:22px 26px;
    border-radius:14px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
  }
  .header h1{margin:0;font-size:1.3rem;}
  .header p{margin:4px 0 0;font-size:0.85rem;opacity:0.9;}
  #timer{
    background:rgba(255,255,255,0.18);
    padding:10px 18px;
    border-radius:10px;
    font-size:1.3rem;
    font-weight:bold;
    min-width:100px;
    text-align:center;
  }
  #timer.warn{background:#e03131;}
  .progress-wrap{
    background:#dbe3ee;
    border-radius:8px;
    height:10px;
    margin-bottom:20px;
    overflow:hidden;
  }
  #progress-bar{
    height:100%;
    background:var(--primary);
    width:0%;
    transition:width 0.3s;
  }
  .card{
    background:var(--card);
    border-radius:14px;
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    border:1px solid var(--border);
  }
  .q-number{
    display:inline-block;
    background:var(--primary);
    color:#fff;
    width:30px;
    height:30px;
    border-radius:50%;
    text-align:center;
    line-height:30px;
    font-size:0.85rem;
    margin-left:10px;
  }
  .q-text{
    font-size:1.05rem;
    font-weight:600;
    margin:10px 0 16px;
    line-height:1.6;
}
  .q-code{
    background:#0f172a;
    color:#e2e8f0;
    padding:12px 16px;
    border-radius:8px;
    font-family:'Consolas','Courier New',monospace;
    direction:ltr;
    text-align:left;
    margin:10px 0 16px;
    white-space:pre;
    overflow-x:auto;
    font-size:0.9rem;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    border:2px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    transition:all 0.15s;
    font-size:0.98rem;
  }
  .option:hover{border-color:var(--primary);background:#f0f6ff;}
  .option.selected{
    border-color:var(--primary);
    background:#e7f1ff;
    font-weight:600;
  }
  .option input{accent-color:var(--primary);}
  .footer-bar{
    position:sticky;
    bottom:0;
    background:var(--bg);
    padding:14px 0;
    text-align:center;
  }
  button{
    background:var(--primary);
    color:#fff;
    border:none;
    padding:14px 40px;
    font-size:1.05rem;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:background 0.15s;
  }
  button:hover{background:var(--primary-dark);}
  button:disabled{background:#94a3b8;cursor:not-allowed;}
  #results{
    display:none;
  }
  .score-card{
    text-align:center;
    background:var(--card);
    border-radius:14px;
    padding:30px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .score-num{
    font-size:3rem;
    font-weight:bold;
    color:var(--primary);
  }
  .score-msg{
    font-size:1.1rem;
    color:var(--muted);
    margin-top:6px;
  }
  .review-item{
    border-right:5px solid var(--correct);
  }
  .review-item.wrong{
    border-right:5px solid var(--wrong);
  }
  .answer-line{
    padding:10px 12px;
    border-radius:8px;
    margin-top:6px;
    font-size:0.95rem;
  }
  .answer-line.correct{background:#ebfbee;color:var(--correct);font-weight:600;}
  .answer-line.wrong{background:#fff5f5;color:var(--wrong);font-weight:600;}
  #not-answered-warning{
    color:var(--wrong);
    text-align:center;
    margin-bottom:10px;
    font-size:0.9rem;
    display:none;
  }
  .unanswered{border-color:#f59f00 !important;}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <h1>امتحان لغة ++C</h1>
      <p>حتى الحلقات التكرارية (Loops) — 20 سؤال اختيار من متعدد</p>
    </div>
    <div id="timer">20:00</div>
  </div>

  <div class="progress-wrap"><div id="progress-bar"></div></div>

  <div id="quiz-area"></div>

  <div id="not-answered-warning">من فضلك أجب عن جميع الأسئلة قبل التسليم (يمكنك التمرير لأعلى لمراجعتها)</div>

  <div class="footer-bar">
    <button id="submit-btn">تسليم الامتحان</button>
  </div>

  <div id="results">
    <div class="score-card">
      <div class="score-num" id="score-num">0 / 20</div>
      <div class="score-msg" id="score-msg"></div>
    </div>
    <div id="review-area"></div>
  </div>

</div>

<script>
const questions = [
  {
    q: "ما هو الملف الرأسي (header file) الذي يجب تضمينه لاستخدام cin و cout؟",
    options: ["conio.h", "iostream", "stdio.h", "math.h"],
    correct: 1
  },
  {
    q: "ما اسم الدالة التي يبدأ منها تنفيذ أي برنامج C++؟",
    options: ["start()", "run()", "main()", "begin()"],
    correct: 2
  },
  {
    q: "أي مما يلي هو الشكل الصحيح لتعليق من سطر واحد في C++؟",
    options: ["# هذا تعليق", "// هذا تعليق", "<!-- هذا تعليق -->", "** هذا تعليق **"],
    correct: 1
  },
  {
    q: "أي نوع بيانات هو الأنسب لتخزين قيمة مثل 3.14؟",
    options: ["int", "char", "float", "bool"],
    correct: 2
  },
  {
    q: "أي نوع بيانات يُستخدم لتخزين حرف واحد فقط مثل 'A'؟",
    options: ["string", "char", "int", "float"],
    correct: 1
  },
  {
    q: "أي أمر يُستخدم لطباعة نص أو قيمة على الشاشة؟",
    options: ["cin", "cout", "print", "input"],
    correct: 1
  },
  {
    q: "أي أمر يُستخدم لإدخال قيمة من المستخدم عبر لوحة المفاتيح؟",
    options: ["cout", "read", "cin", "get"],
    correct: 2
  },
  {
    q: "ما الرمز الذي يُستخدم مع cout لإرسال البيانات إلى الشاشة؟",
    options: [">>", "<<", "::", "->"],
    correct: 1
  },
  {
    q: "ما ناتج التعبير التالي: 7 % 2",
    options: ["3.5", "0", "1", "3"],
    correct: 2
  },
  {
    q: "أي عامل من عوامل المقارنة يُستخدم للتحقق من عدم التساوي بين قيمتين؟",
    options: ["==", "=", "!=", "<>"],
    correct: 2
  },
  {
    q: "أي كلمة مفتاحية تُستخدم لتعريف قيمة ثابتة لا تتغير أثناء تنفيذ البرنامج؟",
    options: ["static", "const", "fixed", "final"],
    correct: 1
  },
  {
    q: "أي جملة شرطية تُستخدم بكفاءة عند الاختيار بين عدة حالات لنفس المتغير؟",
    options: ["if فقط", "for", "switch", "while"],
    correct: 2
  },
  {
    q: "في جملة if-else، متى يتم تنفيذ كتلة else؟",
    options: [
      "عندما يكون الشرط true دائمًا",
      "عندما يكون الشرط false",
      "لا تُنفذ أبدًا",
      "قبل فحص الشرط"
    ],
    correct: 1
  },
  {
    q: "كم مرة سيتم تنفيذ جسم الحلقة التالية؟",
    code: "for(int i = 0; i < 5; i++)\n{\n    cout << i;\n}",
    options: ["4 مرات", "5 مرات", "6 مرات", "مرة واحدة"],
    correct: 1
  },
  {
    q: "ما الفرق الأساسي بين حلقة while وحلقة do-while؟",
    options: [
      "لا يوجد فرق بينهما",
      "حلقة do-while تُنفذ جسم الحلقة مرة واحدة على الأقل حتى لو كان الشرط خطأ",
      "حلقة while أسرع دائمًا",
      "حلقة do-while لا تحتوي على شرط"
    ],
    correct: 1
  },
  {
    q: "ما وظيفة أمر break عند استخدامه داخل حلقة تكرارية؟",
    options: [
      "ينهي البرنامج بالكامل",
      "يتخطى السطر التالي فقط",
      "ينهي الحلقة فورًا ويخرج منها",
      "يعيد تشغيل الحلقة من البداية"
    ],
    correct: 2
  },
  {
    q: "ما وظيفة أمر continue عند استخدامه داخل حلقة تكرارية؟",
    options: [
      "ينهي الحلقة نهائيًا",
      "يتجاوز باقي أوامر التكرار الحالي وينتقل للتكرار التالي",
      "يوقف البرنامج مؤقتًا",
      "يطبع رسالة خطأ"
    ],
    correct: 1
  },
  {
    q: "ما ناتج تنفيذ الكود التالي؟",
    code: "int x = 0;\nfor(int i = 1; i <= 3; i++)\n{\n    x += i;\n}\ncout << x;",
    options: ["3", "6", "5", "خطأ في البرنامج"],
    correct: 1
  },
  {
    q: "أي من الحلقتين التاليتين تتحقق من الشرط قبل تنفيذ جسم الحلقة (حلقة الشرط المسبق)؟",
    options: ["do-while فقط", "for و while", "لا يوجد فرق", "لا شيء مما سبق"],
    correct: 1
  },
  {
    q: "في المثال for(int i = 0; i < 10; i++)، ما الدور الذي يلعبه المتغير i عادةً؟",
    options: [
      "متغير غير مستخدم",
      "متغير عداد (counter) يتحكم في عدد مرات التكرار",
      "اسم الدالة",
      "نوع بيانات"
    ],
    correct: 1
  }
];

const TOTAL_TIME = 20 * 60; // 20 minutes in seconds
let timeLeft = TOTAL_TIME;
let timerInterval;
let userAnswers = new Array(questions.length).fill(null);
let submitted = false;

function renderQuiz(){
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';
  questions.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + idx;

    let codeHtml = '';
    if(item.code){
      codeHtml = `<div class="q-code">${item.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
    }

    let optionsHtml = '';
    item.options.forEach((opt, oIdx) => {
      optionsHtml += `
        <label class="option" data-q="${idx}" data-o="${oIdx}">
          <input type="radio" name="q${idx}" value="${oIdx}">
          <span>${opt}</span>
        </label>`;
    });

    card.innerHTML = `
      <div><span class="q-number">${idx+1}</span></div>
      <div class="q-text">${item.q}</div>
      ${codeHtml}
      <div class="options">${optionsHtml}</div>
    `;
    area.appendChild(card);
  });

  document.querySelectorAll('.option').forEach(opt => {
    opt.addEventListener('click', function(){
      const qIdx = parseInt(this.dataset.q);
      const oIdx = parseInt(this.dataset.o);
      userAnswers[qIdx] = oIdx;
      const card = document.getElementById('card-'+qIdx);
      card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      this.classList.add('selected');
      card.classList.remove('unanswered');
      this.querySelector('input').checked = true;
      updateProgress();
    });
  });
}

function updateProgress(){
  const answered = userAnswers.filter(a => a !== null).length;
  const pct = (answered / questions.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function formatTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m + ':' + s;
}

function startTimer(){
  const timerEl = document.getElementById('timer');
  timerInterval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = formatTime(timeLeft);
    if(timeLeft <= 60){
      timerEl.classList.add('warn');
    }
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      finishExam(true);
    }
  }, 1000);
}

function finishExam(autoSubmit){
  if(submitted) return;

  if(!autoSubmit){
    const unanswered = userAnswers.some(a => a === null);
    if(unanswered){
      document.getElementById('not-answered-warning').style.display = 'block';
      userAnswers.forEach((a, idx) => {
        if(a === null){
          document.getElementById('card-'+idx).classList.add('unanswered');
        }
      });
      return;
    }
  }

  submitted = true;
  clearInterval(timerInterval);
  document.getElementById('not-answered-warning').style.display = 'none';

  let score = 0;
  const reviewArea = document.getElementById('review-area');
  reviewArea.innerHTML = '';

  questions.forEach((item, idx) => {
    const userA = userAnswers[idx];
    const isCorrect = userA === item.correct;
    if(isCorrect) score++;

    const div = document.createElement('div');
    div.className = 'card review-item' + (isCorrect ? '' : ' wrong');

    let codeHtml = '';
    if(item.code){
      codeHtml = `<div class="q-code">${item.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
    }

    let userAnswerText = userA === null ? 'لم تتم الإجابة' : item.options[userA];
    let answerHtml = '';
    if(isCorrect){
      answerHtml = `<div class="answer-line correct">إجابتك: ${userAnswerText} ✓ إجابة صحيحة</div>`;
    } else {
      answerHtml = `
        <div class="answer-line wrong">إجابتك: ${userAnswerText} ✗</div>
        <div class="answer-line correct">الإجابة الصحيحة: ${item.options[item.correct]}</div>
      `;
    }

    div.innerHTML = `
      <div><span class="q-number">${idx+1}</span></div>
      <div class="q-text">${item.q}</div>
      ${codeHtml}
      ${answerHtml}
    `;
    reviewArea.appendChild(div);
  });

  document.getElementById('score-num').textContent = score + ' / ' + questions.length;
  const pct = Math.round((score/questions.length)*100);
  let msg = '';
  if(pct >= 90) msg = 'ممتاز! أداء رائع 🌟';
  else if(pct >= 75) msg = 'جيد جدًا! استمر في المذاكرة 👏';
  else if(pct >= 50) msg = 'جيد، يحتاج لمزيد من المراجعة 📘';
  else msg = 'يُنصح بمراجعة الدروس من البداية 🔁';
  document.getElementById('score-msg').textContent = `نسبة النجاح: ${pct}% — ${msg}`;

  document.getElementById('quiz-area').style.display = 'none';
  document.querySelector('.footer-bar').style.display = 'none';
  document.querySelector('.progress-wrap').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('submit-btn').addEventListener('click', () => finishExam(false));

renderQuiz();
startTimer();
</script>

</body>
</html>
